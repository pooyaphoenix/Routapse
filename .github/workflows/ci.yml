name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r router/requirements.txt
      - name: Compile
        run: python -m compileall -q backend router
      - name: Backend tests
        working-directory: backend
        run: STORE_URL=file:///tmp/ci-test-store.json LOG_DIR=/tmp/ci-test-logs python -m unittest discover -s tests -t . -v
      - name: Router sidecar tests
        working-directory: router
        run: python -m unittest discover -s tests -t . -v
      - name: Import both apps
        run: |
          (cd backend && ROLE=all STORE_URL=file:///tmp/ci-store.json LOG_DIR=/tmp/ci-logs \
             python -c "from app.main import app; print(len(app.routes), 'routes')")
          (cd router && python -c "from app.main import app; print('router sidecar ok')")

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: frontend
        run: |
          npm install
          npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
